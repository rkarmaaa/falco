[package]
name = "falco-ui"
description = "Finestra di Falco (Tauri 2), avviata su richiesta dal core"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "falco-ui"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
falco-proto = { workspace = true, features = ["transport"] }
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
# Una sola finestra: una seconda apertura porta in primo piano quella esistente
tauri-plugin-single-instance = "2"
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["sync", "time", "io-util", "macros"] }

[target.'cfg(windows)'.dependencies]
# Incorporare la finestra di Moonlight (ADR 0015); già presente tra le dipendenze di Tauri
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading"] }
# Volume dello stream per sessione audio (WASAPI); stessa versione già usata da Tauri
windows = { version = "0.61", features = ["Win32_Media_Audio", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant"] }

[lints]
workspace = true
