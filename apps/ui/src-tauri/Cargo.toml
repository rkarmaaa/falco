[package]
name = "falo-ui"
description = "Finestra di Falò (Tauri 2), avviata su richiesta dal core"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "falo-ui"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
falo-proto = { workspace = true, features = ["transport"] }
tauri = { version = "2", features = [] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["sync", "time", "io-util", "macros"] }

[lints]
workspace = true
