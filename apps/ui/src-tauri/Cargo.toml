[package]
name = "falco-ui"
description = "Finestra di Falco (Tauri 2), avviata su richiesta dal core"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "falco-ui"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
falco-proto = { workspace = true, features = ["transport"] }
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["sync", "time", "io-util", "macros"] }

[target.'cfg(windows)'.dependencies]
# Incorporare la finestra di Moonlight (ADR 0015); già presente tra le dipendenze di Tauri
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[lints]
workspace = true
