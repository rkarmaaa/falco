[package]
name = "falco-core"
description = "Demone di Falco: tray, orchestrazione dei motori, IPC verso la UI"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "falco-core"
path = "src/main.rs"

[dependencies]
falco-proto = { workspace = true, features = ["transport"] }
falco-net.workspace = true
falco-store.workspace = true
falco-engines.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
interprocess.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "sync", "io-util", "time", "net", "process"] }
tray-icon.workspace = true
tao.workspace = true
global-hotkey.workspace = true
mdns-sd = "0.13"
auto-launch = "0.6"
minisign-verify = "0.3"
semver = "1"
image.workspace = true
webp.workspace = true
sha2.workspace = true
axum.workspace = true
data-encoding.workspace = true
ureq.workspace = true
opener = "0.8"
notify-rust = "4"
keyring.workspace = true
sysinfo.workspace = true
display-info = "0.5"

[lints]
workspace = true

[build-dependencies]
embed-manifest = "1"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
willhook = "0.6"       # hook LL: input iniettati da Sunshine (icone che si illuminano)
rusty-xinput = "1.3"   # stato dei controller virtuali degli ospiti
