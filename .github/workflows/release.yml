name: Release

# Un tag vX.Y.Z costruisce, firma e pubblica i pacchetti con il manifest dell'updater.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Pacchetto · ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x64, os: windows-latest, target: x86_64-pc-windows-msvc }
          - { name: macos-arm64, os: macos-latest, target: aarch64-apple-darwin }
          - { name: macos-x64, os: macos-15-intel, target: x86_64-apple-darwin }
    runs-on: ${{ matrix.os }}
    env:
      # Chiave minisign dell'updater (segreti del repository, ADR 0008)
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/ui/package-lock.json

      - name: Core
        run: cargo build --release -p falco-core --target ${{ matrix.target }}

      - name: Sidecar del core
        shell: bash
        run: |
          mkdir -p apps/ui/src-tauri/binaries
          ext=""; [[ "${{ runner.os }}" == "Windows" ]] && ext=".exe"
          cp "target/${{ matrix.target }}/release/falco-core$ext" "apps/ui/src-tauri/binaries/falco-core-${{ matrix.target }}$ext"

      # Motori: i fork compilati (engines/) quando ci sono; per ora i pacchetti ufficiali
      - name: Motori (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install sunshine moonlight-qt -y --no-progress
          ./scripts/stage-engines.ps1 -Profile release
          New-Item -ItemType Directory -Force target/${{ matrix.target }}/release | Out-Null
          Copy-Item -Recurse -Force target/release/engines target/${{ matrix.target }}/release/

      - name: Interfaccia e pacchetto
        working-directory: apps/ui
        shell: bash
        run: |
          npm ci
          bundles="nsis"; [[ "${{ runner.os }}" == "macOS" ]] && bundles="app,dmg"
          npx tauri build --target ${{ matrix.target }} --bundles "$bundles" --config src-tauri/tauri.bundle.json --config '{"bundle":{"createUpdaterArtifacts":true}}'

      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.name }}
          path: |
            target/${{ matrix.target }}/release/bundle/nsis/*.exe
            target/${{ matrix.target }}/release/bundle/nsis/*.sig
            target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            target/${{ matrix.target }}/release/bundle/macos/*.tar.gz
            target/${{ matrix.target }}/release/bundle/macos/*.sig

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Manifest dell'updater
        run: |
          find dist -type f -exec mv {} dist/ \; 2>/dev/null || true
          node scripts/make-manifest.mjs "${GITHUB_REF_NAME}" \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}" dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
