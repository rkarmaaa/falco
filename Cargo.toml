[workspace]
resolver = "3"
members = ["apps/core", "apps/ui/src-tauri", "crates/*"]

[workspace.package]
version = "1.0.0-rc.14"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/rkarmaaa/falco"
rust-version = "1.85"

[workspace.dependencies]
falco-proto = { path = "crates/falco-proto" }
falco-net = { path = "crates/falco-net" }
falco-store = { path = "crates/falco-store" }
falco-engines = { path = "crates/falco-engines" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_json_canonicalizer = "0.3"
tokio = { version = "1", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "std"] }
tracing-appender = "0.2"
ed25519-dalek = "2"
rand = "0.9"
sha2 = "0.10"
data-encoding = "2"
zstd = { version = "0.13", default-features = false }
directories = "6"
toml_edit = { version = "0.22", features = ["serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }
which = "7"
interprocess = { version = "2", features = ["tokio"] }
tray-icon = "0.25"
tao = "0.37"
global-hotkey = "0.7"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
webp = "0.3"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json", "query"] }
tempfile = "3"
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
keyring = { version = "3", features = ["windows-native", "apple-native"] }
sysinfo = { version = "0.37", default-features = false, features = ["system"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"

[profile.release]
opt-level = 3
# LTO «thin» con 16 unità: prestazioni quasi uguali a «fat», collegamento molto più veloce.
# Il codice critico per la latenza è in Sunshine e Moonlight, non nel core.
lto = "thin"
codegen-units = 16
panic = "abort"
strip = true
